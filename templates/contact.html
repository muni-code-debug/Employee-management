{% extends "base.html" %}

{% block content %}

<div class="card shadow">

<div class="card-header bg-primary text-white">

<h3>Contact Employee</h3>

</div>

<div class="card-body">

<form method="POST">

<div class="mb-3">

<label>Select Employee</label>

<select class="form-control" id="employeeSelect">

<option value="">Choose Employee</option>

{% for emp in employees %}

<option
value="{{ emp.email }}">

{{ emp.name }} ({{ emp.email }})

</option>

{% endfor %}

</select>

</div>

<div class="mb-3">

<label>Email</label>

<input
type="email"
name="email"
id="email"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Subject</label>

<input
type="text"
name="subject"
class="form-control"
required>

</div>

<div class="mb-3">

<label>Message</label>

<textarea
name="message"
class="form-control"
rows="6"
required></textarea>

</div>

<button class="btn btn-success">

Send Email

</button>

</form>

</div>

</div>

<script>

document.getElementById("employeeSelect").addEventListener("change",function(){

document.getElementById("email").value=this.value;

});

</script>

{% endblock %}
