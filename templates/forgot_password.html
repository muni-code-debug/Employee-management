{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card shadow">

            <div class="card-header bg-danger text-white">

                <h3 class="text-center">
                    Forgot Password
                </h3>
                

            </div>

            <div class="card-body">

                <form method="POST">

                    <div class="mb-3">

                        <label>Registered Email</label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            required>

                    </div>

                    <button class="btn btn-primary w-100">

                        Send Reset Link

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
